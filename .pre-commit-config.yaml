repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      # tsconfig.json is JSONC: TypeScript allows comments there, so a strict JSON parse rejects it.
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
